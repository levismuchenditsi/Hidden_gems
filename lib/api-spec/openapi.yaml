openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Database-verified administrative operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/status:
    get:
      operationId: getAdminStatus
      tags: [admin]
      summary: Verify the caller's admin role
      description: Verifies the Supabase JWT and checks the caller's role in the database.
      security:
        - supabaseBearerAuth: []
      responses:
        "200":
          description: Caller is an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
        "401":
          description: Missing or invalid Supabase access token
        "403":
          description: Caller is authenticated but is not an administrator
components:
  securitySchemes:
    supabaseBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminStatus:
      type: object
      properties:
        isAdmin:
          type: boolean
      required:
        - isAdmin

