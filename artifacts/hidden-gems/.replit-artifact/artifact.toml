kind = "web"
previewPath = "/"
title = "HIDDEN GEMS"
description = "A social travel discovery app for finding, sharing, rating, and exploring hidden destinations in Kenya, with admin-reviewed submissions."
version = "1.0.0"
id = "artifacts/hidden-gems"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21074

[services.development]
run = "pnpm --filter @workspace/hidden-gems run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hidden-gems", "run", "build" ]
serve = "static"
publicDir = "artifacts/hidden-gems/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21074"
BASE_PATH = "/"
